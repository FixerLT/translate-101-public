name: Deploy Vite Site to Pages

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

on:
  push:
    branches: [master] # Or master, depending on your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-with-cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # FORCE REBUILD TRIGGER: This guarantees package.json updates, forcing a unique hash sequence
      - name: Bump patch version to force cache busting
        run: npm version patch --no-git-tag-version
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          clean: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
